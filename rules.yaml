# 应用分流规则（Clash 格式，仅含 rules 段）
# 用法：
#   1) 先在客户端导入订阅，订阅提供节点与策略分组
#   2) 在该订阅的「配置」中，把「远程规则 / Remote Rule」指向下方 raw 链接：
#      https://raw.githubusercontent.com/SoulmatelynchVFX/client-rules/main/rules.yaml
#   3) 规则随订阅生效；改动本文件后，在客户端刷新订阅即可
# 注意：代理策略名必须与订阅里的分组名一致（下面用「🔰 选择节点」，
#       若 客户端 中显示不同如 Proxy，请把全文件 🔰 选择节点 替换掉）。

rules:
  # ===== 国内 App 规则集 → 直连（正常网络）=====
  # 数据源：blackmatrix7/ios_rule_script（按 App 分类的现成域名规则集，每日随上游更新）
  - RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/WeChat/WeChat.list,DIRECT
  - RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Alibaba/Alibaba.list,DIRECT
  - RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/AliPay/AliPay.list,DIRECT
  - RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Baidu/Baidu.list,DIRECT
  - RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/BiliBili/BiliBili.list,DIRECT
  - RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/ByteDance/ByteDance.list,DIRECT
  - RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/DouYin/DouYin.list,DIRECT
  - RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/JingDong/JingDong.list,DIRECT
  - RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/MeiTuan/MeiTuan.list,DIRECT
  - RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Weibo/Weibo.list,DIRECT
  - RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/XiaoHongShu/XiaoHongShu.list,DIRECT
  # 闲鱼（阿里系，规则集未单列，单独补）
  - DOMAIN-SUFFIX,goofish.com,DIRECT
  - DOMAIN-SUFFIX,idlefish.com,DIRECT

  # ===== 国外 AI / 社交 规则集 → 代理（经节点出口）=====
  - RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/OpenAI/OpenAI.list,🔰 选择节点
  - RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Google/Google.list,🔰 选择节点
  - RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Anthropic/Anthropic.list,🔰 选择节点
  - RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Claude/Claude.list,🔰 选择节点
  - RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Telegram/Telegram.list,🔰 选择节点
  - RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Twitter/Twitter.list,🔰 选择节点
  - RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/YouTube/YouTube.list,🔰 选择节点

  # ===== 通用国内外兜底（无需逐个列 App）=====
  - GEOIP,CN,DIRECT                  # 国内 IP 直连
  - DOMAIN-SUFFIX,cn,DIRECT          # .cn 域名直连
  - MATCH,🔰 选择节点                # 其余一律走代理
