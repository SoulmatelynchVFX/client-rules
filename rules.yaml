# 历史规则清单（仅含 rules 段），保留用于对照与离线测试。
# iOS Shadowrocket 请导入 shadowrocket.conf，不要把本文件当作完整配置。
# 本清单的「🔰 选择节点」在原生配置中映射为 PROXY，MATCH 映射为 FINAL。

rules:
  # 国际版 Lark 专属域名例外；必须在 ByteDance 等公司级集合之前
  - DOMAIN-SUFFIX,larksuite.com,🔰 选择节点
  - DOMAIN-SUFFIX,larksuitecdn.com,🔰 选择节点

  # BiliBili 国际站例外；必须在国内 BiliBili 等直连集合之前
