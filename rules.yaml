# 应用分流规则（Clash 格式，仅含 rules 段）
# 用法：
#   1) 先在客户端导入订阅，订阅提供节点与策略分组
#   2) 在该订阅的「配置」中，把「远程规则 / Remote Rule」指向下方 raw 链接：
#      https://raw.githubusercontent.com/SoulmatelynchVFX/client-rules/main/rules.yaml
#   3) 规则随订阅生效；改动本文件后，在客户端刷新订阅即可
# 注意：代理策略名必须与订阅里的分组名一致（下面用「🔰 选择节点」，
#       若 客户端 中显示不同如 Proxy，请把全文件 🔰 选择节点 替换掉）。

rules:
  # ===== 国内 App → 直连（正常网络）=====
  # 微信
  - DOMAIN-SUFFIX,wechat.com,DIRECT
  - DOMAIN-SUFFIX,weixin.qq.com,DIRECT
  - DOMAIN-SUFFIX,qq.com,DIRECT
  - DOMAIN-SUFFIX,tencent.com,DIRECT
  # 闲鱼 / 淘宝 / 天猫
  - DOMAIN-SUFFIX,goofish.com,DIRECT
  - DOMAIN-SUFFIX,taobao.com,DIRECT
  - DOMAIN-SUFFIX,tmall.com,DIRECT
  # 支付宝
  - DOMAIN-SUFFIX,alipay.com,DIRECT
  - DOMAIN-SUFFIX,alipayobjects.com,DIRECT
  # 抖音 / 头条
  - DOMAIN-SUFFIX,douyin.com,DIRECT
  - DOMAIN-SUFFIX,toutiao.com,DIRECT
  - DOMAIN-SUFFIX,bytedance.com,DIRECT
  # 小红书
  - DOMAIN-SUFFIX,xiaohongshu.com,DIRECT
  - DOMAIN-SUFFIX,xhscdn.com,DIRECT
  # 微博
  - DOMAIN-SUFFIX,weibo.com,DIRECT
  - DOMAIN-SUFFIX,weibocdn.com,DIRECT
  # 百度
  - DOMAIN-SUFFIX,baidu.com,DIRECT
  - DOMAIN-SUFFIX,bdstatic.com,DIRECT
  # 京东
  - DOMAIN-SUFFIX,jd.com,DIRECT
  - DOMAIN-SUFFIX,jd.com.cn,DIRECT
  # 美团
  - DOMAIN-SUFFIX,meituan.com,DIRECT
  # 哔哩哔哩
  - DOMAIN-SUFFIX,bilibili.com,DIRECT
  - DOMAIN-SUFFIX,biliimg.com,DIRECT

  # ===== 国外 AI / 软件 → 代理（经节点出口）=====
  # OpenAI / ChatGPT
  - DOMAIN-SUFFIX,openai.com,🔰 选择节点
  - DOMAIN-SUFFIX,chat.openai.com,🔰 选择节点
  - DOMAIN-SUFFIX,oaistatic.com,🔰 选择节点
  - DOMAIN-SUFFIX,oaiusercontent.com,🔰 选择节点
  # Google / Gemini
  - DOMAIN-SUFFIX,gemini.google.com,🔰 选择节点
  - DOMAIN-SUFFIX,ai.google,🔰 选择节点
  - DOMAIN-SUFFIX,googleapis.com,🔰 选择节点
  # Anthropic / Claude
  - DOMAIN-SUFFIX,claude.ai,🔰 选择节点
  - DOMAIN-SUFFIX,anthropic.com,🔰 选择节点
  # xAI / Grok
  - DOMAIN-SUFFIX,x.ai,🔰 选择节点
  # Hugging Face
  - DOMAIN-SUFFIX,huggingface.co,🔰 选择节点

  # ===== 通用国内外兜底 =====
  - GEOIP,CN,DIRECT                  # 国内 IP 直连
  - DOMAIN-SUFFIX,cn,DIRECT          # .cn 域名直连
  - MATCH,🔰 选择节点                # 其余一律走代理
